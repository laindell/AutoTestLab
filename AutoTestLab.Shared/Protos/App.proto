syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "AutoTestLab.Shared.Protos";

package app;

service FileService {
  rpc UploadFile (stream UploadFileRequest) returns (UploadFileResponse);
  rpc GetMyFiles (google.protobuf.Empty) returns (FileListResponse);
}

message UploadFileRequest {
  string file_name = 1;
  bytes content = 2;
}

message UploadFileResponse {
  int32 file_id = 1;
  string status = 2;
}

message FileListResponse {
  repeated FileDto files = 1;
}

message FileDto {
  int32 id = 1;
  string name = 2;
  string status = 3;
  google.protobuf.Timestamp uploaded_at = 4;
}

service TestService {
  rpc GenerateTest (GenerateTestRequest) returns (TestResponse);
  rpc GetMyTests (google.protobuf.Empty) returns (TestListResponse);
  rpc GetTestForTaking (GetTestRequest) returns (TakeTestResponse);
  rpc SubmitTestAnswers (SubmitTestRequest) returns (SubmitTestResponse);
}

message GenerateTestRequest {
  int32 file_id = 1;
  string difficulty = 2;
  int32 question_count = 3;
  string language = 4;
}

message TestResponse {
  int32 test_id = 1;
  string name = 2;
  repeated TestQuestionDto questions = 3;
}

message TestQuestionDto {
  string question_text = 1;
  repeated string options = 2;
  int32 correct_option_index = 3;
}

message TestListResponse {
  repeated TestSummaryDto tests = 1;
}

message TestSummaryDto {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

service GroupService {
  rpc CreateGroup (CreateGroupRequest) returns (GroupResponse);
  rpc JoinGroup (JoinGroupRequest) returns (GroupResponse);
  rpc GetGroupTests (GetGroupTestsRequest) returns (TestListResponse);
  rpc ShareTest (ShareTestRequest) returns (google.protobuf.Empty);
}

message CreateGroupRequest {
  string name = 1;
}

message JoinGroupRequest {
  string join_code = 1;
}

message GroupResponse {
  int32 group_id = 1;
  string name = 2;
  string join_code = 3;
}

message GetGroupTestsRequest {
  int32 group_id = 1;
}

message ShareTestRequest {
  int32 test_id = 1;
  int32 group_id = 2;
}

message GetTestRequest {
  int32 test_id = 1;
}

message TakeTestResponse {
  int32 test_id = 1;
  string name = 2;
  string description = 3;
  int32 time_limit_seconds = 4;
  repeated TakeTestQuestionDto questions = 5;
}

message TakeTestQuestionDto {
  int32 question_id = 1;
  string question_text = 2;
  repeated string options = 3;
}

message SubmitTestRequest {
  int32 test_id = 1;
  repeated UserAnswerDto answers = 2;
}

message UserAnswerDto {
  int32 question_id = 1;
  int32 selected_option_index = 2;
}

message SubmitTestResponse {
  double grade = 1;
  int32 correct_answers = 2;
  int32 total_questions = 3;
}