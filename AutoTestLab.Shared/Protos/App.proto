syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "AutoTestLab.Shared.Protos";

package app;

service FileService {
  rpc UploadFile (stream UploadFileRequest) returns (UploadFileResponse);
  rpc GetMyFiles (google.protobuf.Empty) returns (FileListResponse);
}

message UploadFileRequest {
  string file_name = 1;
  bytes content = 2;
}

message UploadFileResponse {
  int32 file_id = 1;
  string status = 2;
}

message FileListResponse {
  repeated FileDto files = 1;
}

message FileDto {
  int32 id = 1;
  string name = 2;
  string status = 3;
  google.protobuf.Timestamp uploaded_at = 4;
}

service TestService {
  rpc GenerateTest (GenerateTestRequest) returns (TestResponse);
  rpc GetMyTests (google.protobuf.Empty) returns (TestListResponse);
}

message GenerateTestRequest {
  int32 file_id = 1;
  string difficulty = 2;
  int32 question_count = 3;
  string language = 4;
}

message TestResponse {
  int32 test_id = 1;
  string name = 2;
  repeated TestQuestionDto questions = 3;
}

message TestQuestionDto {
  string question_text = 1;
  repeated string options = 2;
  int32 correct_option_index = 3;
}

message TestListResponse {
  repeated TestSummaryDto tests = 1;
}

message TestSummaryDto {
  int32 id = 1;
  string name = 2;
  string description = 3;
}