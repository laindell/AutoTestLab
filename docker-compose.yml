services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autotestlab
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "1488:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=autotestlab;Username=user;Password=${POSTGRES_PASSWORD}
      - CacheConnection=redis:6379
      - OpenAI__ApiKey=${OPENAI_API_KEY}

volumes:
  pgdata: